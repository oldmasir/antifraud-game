<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0f1923">
<title>重生反诈：以牙还牙</title>
<style>
/* ============================================================
   重生反诈：以牙还牙 — 全部样式
   主色调：蓝色警示风；强调色：红色警示；成功色：绿色
   布局：手机框 + 顶部状态栏 + 中间剧情区 + 底部选项区
   ============================================================ */

/* ===== 重置 & 基础 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1923;--bg2:#16263a;--phone:#1a1a2e;--screen:#f0f4f8;
  --pri:#2563eb;--pri-d:#1d4ed8;--pri-l:#3b82f6;
  --warn:#ef4444;--warn-l:#f87171;--succ:#22c55e;--succ-l:#4ade80;
  --gold:#fbbf24;--purple:#8b5cf6;--orange:#f97316;
  --text:#1e293b;--text-l:#64748b;--text-d:#0f172a;
  --surf:#ffffff;--border:#e2e8f0;--border-d:#cbd5e1;
  --r:12px;--r-s:8px;--r-l:20px;
  --shadow:0 4px 12px rgba(0,0,0,.15);
  --shadow-l:0 8px 30px rgba(0,0,0,.25);
  --pw:420px;--ph:780px;
}
html,body{height:100%;overflow:hidden}
#app{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}

/* ===== 背景Canvas ===== */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#rebirthCanvas{position:fixed;inset:0;z-index:9998;display:none;pointer-events:none}

/* ===== 屏幕管理 ===== */
.screen{display:none;position:relative;z-index:1;width:100%;height:100%;min-height:0}
.screen.active{display:flex}

/* ===== 标题界面 ===== */
#screen-title{align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#screen-title::before{content:'';position:absolute;inset:0;background:url('avatars/title_bg.jpg') center/cover;opacity:.25;z-index:0}
#screen-title::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,25,35,.5),rgba(15,25,35,.9));z-index:0}
#screen-title>*{position:relative;z-index:1}
.title-hero{width:120px;height:120px;border-radius:50%;overflow:hidden;margin-bottom:16px;border:4px solid rgba(37,99,235,.4);box-shadow:0 0 30px rgba(37,99,235,.3),0 4px 20px rgba(0,0,0,.4)}
.title-hero img{width:100%;height:100%;object-fit:cover}
.title-logo{font-size:13px;color:var(--pri-l);letter-spacing:6px;margin-bottom:8px;font-weight:600}
.title-main{font-size:clamp(30px,9vw,44px);font-weight:900;color:#fff;letter-spacing:4px;margin-bottom:6px;
  text-shadow:0 0 30px rgba(37,99,235,.6),0 2px 8px rgba(0,0,0,.5)}
.title-sub{font-size:clamp(16px,4.5vw,22px);color:var(--gold);font-weight:700;letter-spacing:2px;margin-bottom:4px}
.title-desc{font-size:13px;color:var(--text-l);margin-bottom:32px;max-width:300px;line-height:1.8}
.title-desc b{color:var(--warn-l)}
.btn-menu{
  width:260px;max-width:80vw;padding:14px 0;margin:7px 0;border:none;border-radius:var(--r);
  font-size:17px;font-weight:600;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
}
.btn-menu.primary{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.4)}
.btn-menu.primary:active{transform:scale(.97)}
.btn-menu.secondary{background:rgba(255,255,255,.08);color:#cbd5e1;border:1.5px solid rgba(255,255,255,.15)}
.btn-menu.secondary:active{background:rgba(255,255,255,.12)}
.btn-menu.disabled{opacity:.4;pointer-events:none}
.title-footer{margin-top:28px;font-size:11px;color:#475569;line-height:1.8}
.title-footer b{color:var(--warn-l)}
.title-copyright{margin-top:12px;font-size:10px;color:#64748b;letter-spacing:1px;line-height:1.6;border-top:1px solid rgba(255,255,255,.06);padding-top:10px}

/* ===== 开场CG动画 — 翻书效果 ===== */
#cg-intro{position:fixed;inset:0;z-index:9999;background:#000;display:none;overflow:hidden;perspective:1500px}
#cg-intro.active{display:block}
.cg-page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;opacity:0;transition:transform 1.2s cubic-bezier(.55,.085,.32,1.1),opacity .6s ease}
.cg-page.current{opacity:1;transform:rotateY(0deg)}
.cg-page.flipped{opacity:1;transform:rotateY(-180deg)}
.cg-page img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cg-page-back{position:absolute;inset:0;background:#0a0a1a;transform:rotateY(180deg);backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.cg-page-back::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9),rgba(0,0,0,.3));}
.cg-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.65) 100%);pointer-events:none;z-index:1}
.cg-page .cg-caption{position:absolute;bottom:8%;left:50%;transform:translateX(-50%) translateY(15px);color:#fff;font-size:17px;font-weight:700;text-shadow:0 2px 20px rgba(0,0,0,1),0 0 40px rgba(37,99,235,.4);text-align:center;max-width:85%;opacity:0;transition:all .8s ease .4s;z-index:2;letter-spacing:2px}
.cg-page.current .cg-caption{opacity:1;transform:translateX(-50%) translateY(0)}
.cg-spine{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(90deg,rgba(0,0,0,.8),transparent);z-index:10;pointer-events:none}
.cg-shadow{position:absolute;left:0;top:0;bottom:0;width:60px;background:linear-gradient(90deg,rgba(0,0,0,.4),transparent);z-index:9;pointer-events:none;opacity:0;transition:opacity .6s ease}
.cg-page.current .cg-shadow{opacity:1}
.cg-title-reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;transition:opacity 1.5s ease;background:radial-gradient(ellipse at center,rgba(15,25,35,.3),rgba(0,0,0,.9))}
.cg-title-reveal.active{opacity:1}
.cg-title-reveal .main{font-size:clamp(36px,10vw,56px);font-weight:900;color:#fff;letter-spacing:8px;text-shadow:0 0 40px rgba(37,99,235,.8),0 0 80px rgba(37,99,235,.4),0 4px 12px rgba(0,0,0,1);transform:scale(.8);transition:transform 1.5s ease}
.cg-title-reveal.active .main{transform:scale(1)}
.cg-title-reveal .sub{position:absolute;bottom:25%;font-size:clamp(14px,4vw,20px);color:var(--gold);font-weight:700;letter-spacing:4px;text-shadow:0 2px 12px rgba(0,0,0,1);opacity:0;transition:opacity 1s ease 1s}
.cg-title-reveal.active .sub{opacity:1}
.cg-skip{position:absolute;top:16px;left:16px;z-index:9998;background:rgba(0,0,0,.5);color:#cbd5e1;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}
.cg-skip:active{background:rgba(0,0,0,.7)}

/* ===== 手机框 ===== */
#screen-game{align-items:center;justify-content:center;padding:0}
.phone-frame{
  width:100%;height:100%;max-width:var(--pw);max-height:var(--ph);
  background:var(--phone);border-radius:0;position:relative;
  display:flex;flex-direction:column;overflow:hidden;
}
.phone-screen{flex:1;background:var(--screen);display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}

@media(min-width:481px){
  .phone-frame{
    border-radius:36px;border:10px solid #0d0d1a;
    box-shadow:var(--shadow-l),0 0 0 2px #2a2a3e,0 0 60px rgba(37,99,235,.15);
    height:calc(100vh - 40px);max-height:var(--ph);
  }
}
@media(max-width:480px){
  .phone-frame{border-radius:0}
}

/* ===== 状态栏 ===== */
.status-bar{
  display:flex;align-items:center;gap:6px;padding:10px 12px;
  background:linear-gradient(135deg,var(--bg),var(--bg2));
  color:#fff;flex-shrink:0;flex-wrap:wrap;position:relative;
}
@media(max-width:480px){.status-bar{padding-top:calc(10px + env(safe-area-inset-top))}}
.stat-chip{
  display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--r-s);
  background:rgba(255,255,255,.08);font-size:12px;font-weight:600;white-space:nowrap;
  transition:all .3s;
}
.stat-chip .icon{font-size:14px;line-height:1}
.stat-chip .val{font-variant-numeric:tabular-nums}
.stat-chip.assets{background:rgba(37,99,235,.25)}
.stat-chip.alert{background:rgba(34,197,94,.2)}
.stat-chip.alert.low{background:rgba(239,68,68,.2)}
.stat-chip.trust{background:rgba(139,92,246,.2)}
.stat-chip.rebirth{background:rgba(251,191,36,.15);margin-left:auto}
.stat-bar{width:50px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:2px}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.stat-bar-fill.alert{background:linear-gradient(90deg,var(--warn),var(--succ))}
.stat-bar-fill.trust{background:linear-gradient(90deg,var(--purple),var(--orange))}
.chapter-badge{
  width:100%;text-align:center;font-size:11px;color:var(--text-l);padding:2px 0 0;
  letter-spacing:1px;
}

/* ===== 场景区 ===== */
.scene-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scene-area::-webkit-scrollbar{width:3px}
.scene-area::-webkit-scrollbar-thumb{background:var(--border-d);border-radius:2px}

/* — 叙述场景 — */
.scene-narration{padding:30px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;gap:20px;box-sizing:border-box}
.narration-avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;box-shadow:var(--shadow-l);border:3px solid var(--surf)}
.narration-avatar img{width:100%;height:100%;object-fit:cover}
.narration-avatar svg{width:100%;height:100%}
.narration-text{font-size:17px;line-height:2;color:var(--text);max-width:340px;white-space:pre-line}
.narration-text .em{color:var(--pri);font-weight:700}
.narration-text .danger{color:var(--warn);font-weight:700}
.narration-text .gold{color:var(--gold);font-weight:700}

/* — 聊天场景 — */
.scene-chat{padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-height:100%;justify-content:flex-end;padding-bottom:20px;box-sizing:border-box}
.chat-header{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);margin-bottom:4px}
.chat-header .av{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0}
.chat-header .av img{width:100%;height:100%;object-fit:cover}
.chat-header .av svg{width:100%;height:100%}
.chat-header .name{font-size:14px;font-weight:600;color:var(--text)}
.chat-header .status{font-size:11px;color:var(--succ);margin-left:auto}
.chat-bubble{
  max-width:78%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.6;
  position:relative;animation:bubbleIn .3s ease-out;word-break:break-word;
}
.chat-bubble.other{
  align-self:flex-start;background:var(--surf);color:var(--text);
  border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.chat-bubble.self{
  align-self:flex-end;background:var(--pri);color:#fff;
  border-bottom-right-radius:4px;box-shadow:0 1px 3px rgba(37,99,235,.3);
}
.chat-bubble.system{
  align-self:center;background:rgba(37,99,235,.08);color:var(--pri);
  border-radius:var(--r);font-size:13px;padding:6px 16px;text-align:center;max-width:90%;
}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row .av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0}
.chat-row .av img{width:100%;height:100%;object-fit:cover}
.chat-row .av svg{width:100%;height:100%}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* — 通话场景 — */
.scene-call{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;background:linear-gradient(160deg,#1a2a3a,#0f1923);color:#fff;padding:30px 20px;gap:16px;
}
.call-icon{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:32px;animation:callPulse 2s infinite;overflow:hidden}
.call-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.2)}50%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.call-name{font-size:22px;font-weight:700}
.call-num{font-size:13px;color:#94a3b8}
.call-timer{font-size:13px;color:#64748b;font-variant-numeric:tabular-nums}
.call-subtitle{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r);padding:14px 18px;font-size:15px;line-height:1.7;
  max-width:340px;text-align:center;
}
.call-subtitle .danger{color:var(--warn-l);font-weight:700}

/* — 转账场景 — */
.scene-transfer{padding:20px;background:#eef2f7;min-height:100%}
.transfer-title{text-align:center;font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px}
.transfer-card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.transfer-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9}
.transfer-row:last-child{border:none}
.transfer-label{font-size:13px;color:var(--text-l)}
.transfer-val{font-size:14px;font-weight:600;color:var(--text)}
.transfer-amount-box{text-align:center;padding:20px 0}
.transfer-amount-box .label{font-size:12px;color:var(--text-l);margin-bottom:4px}
.transfer-amount-box .amount{font-size:36px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}
.transfer-amount-box .amount.safe{color:var(--pri)}
.transfer-warning{
  background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r-s);
  padding:10px 14px;font-size:13px;color:var(--warn);text-align:center;margin-bottom:12px;
}

/* — 弹窗通知场景 — */
.scene-popup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:30px 20px;background:#1a1a2e;gap:16px}
.popup-phone{
  width:280px;max-width:85vw;background:#1c1c2e;border-radius:24px;
  border:2px solid #2a2a3e;padding:16px;box-shadow:var(--shadow-l);
}
.popup-bar{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:12px}
.popup-notification{background:#2a2a3e;border-radius:12px;padding:14px;display:flex;gap:10px}
.popup-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.popup-icon img{width:100%;height:100%;object-fit:cover}
.popup-icon svg{width:100%;height:100%}
.popup-content .title{font-size:13px;font-weight:700;color:#fff}
.popup-content .text{font-size:12px;color:#94a3b8;line-height:1.5;margin-top:2px}

/* ===== 选项区 ===== */
.choice-area{
  flex-shrink:0;padding:10px 12px;gap:8px;display:flex;flex-direction:column;
  background:var(--screen);border-top:1px solid var(--border);
}
@media(max-width:480px){.choice-area{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
.choice-btn{
  width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--r);
  background:var(--surf);font-size:15px;font-weight:500;color:var(--text);
  cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;
  animation:choiceIn .25s ease-out backwards;
}
.choice-btn:active{transform:scale(.98);background:#f8fafc}
.choice-btn.correct{border-color:var(--succ);background:#f0fdf4}
.choice-btn.counter{border-color:var(--gold);background:#fffbeb}
.choice-btn.danger{border-color:var(--warn);background:#fef2f2}
.choice-btn .arrow{margin-left:auto;color:var(--text-l);font-size:13px;flex-shrink:0}
.choice-btn .lock{color:var(--text-l);font-size:12px;flex-shrink:0}
.choice-btn.locked{opacity:.5;background:#f8fafc}
.choice-btn.locked .lock{color:var(--warn)}
@keyframes choiceIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== 知识弹窗 ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:20px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:fadeIn .25s;
}
.modal-overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:#fff;border-radius:var(--r-l);max-width:380px;width:100%;
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-l);animation:modalIn .3s ease-out;
  margin:auto 0;
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{
  background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;
  padding:16px 20px;border-radius:var(--r-l) var(--r-l) 0 0;text-align:center;
}
.modal-header .badge{font-size:11px;letter-spacing:2px;opacity:.8;margin-bottom:4px}
.modal-header .title{font-size:18px;font-weight:700}
.modal-body{padding:20px}
.modal-body h4{font-size:14px;color:var(--pri);margin:14px 0 6px;font-weight:700}
.modal-body h4:first-child{margin-top:0}
.modal-body ul{list-style:none;padding:0}
.modal-body li{font-size:13px;color:var(--text);padding:4px 0;padding-left:20px;position:relative;line-height:1.6}
.modal-body li::before{content:'●';position:absolute;left:0;color:var(--pri);font-size:10px;top:6px}
.modal-body .hotline{
  background:#fef2f2;border-radius:var(--r-s);padding:12px;text-align:center;
  margin-top:16px;border:1px solid #fecaca;
}
.modal-body .hotline .num{font-size:24px;font-weight:900;color:var(--warn);letter-spacing:2px}
.modal-body .hotline .desc{font-size:12px;color:var(--text-l);margin-top:4px}
.modal-body .app-promo{
  background:#eff6ff;border-radius:var(--r-s);padding:10px;text-align:center;
  margin-top:8px;font-size:12px;color:var(--pri);border:1px solid #bfdbfe;
}
.modal-close{
  width:100%;padding:14px;border:none;background:var(--pri);color:#fff;
  border-radius:var(--r);font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;
}
.modal-close:active{background:var(--pri-d)}

/* ===== 成就弹窗 ===== */
.achievement-popup{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;
  background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;
  border:2px solid var(--gold);border-radius:var(--r);padding:12px 20px;
  display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(251,191,36,.3);
  animation:achPop .4s ease-out;max-width:340px;
}
@keyframes achPop{0%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.8)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.ach-icon{font-size:28px}
.ach-info .label{font-size:10px;color:var(--gold);letter-spacing:2px}
.ach-info .name{font-size:15px;font-weight:700}

/* ===== Toast提示 ===== */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:150;
  background:rgba(30,41,59,.95);color:#fff;padding:8px 18px;border-radius:20px;
  font-size:13px;box-shadow:var(--shadow);animation:toastIn .3s;max-width:300px;text-align:center;
}
.toast.hidden{display:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.success{background:rgba(22,101,52,.95)}
.toast.danger{background:rgba(153,27,27,.95)}
.toast.gold{background:rgba(120,53,15,.95);border:1px solid var(--gold)}

/* ===== 反击特效 ===== */
.counter-flash{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:rgba(37,99,235,.85);animation:cFlash 1.8s ease-out forwards;pointer-events:none;
}

<script>
/* ============================================================
   重生反诈：以牙还牙 — 游戏引擎
   架构：数据驱动 + 场景渲染器 + 状态机
   修改指南：在 STORY_NODES 中新增节点即可扩展剧情
   ============================================================
   节点格式:
   {
     scene: 'narration'|'chat'|'call'|'transfer'|'popup',
     speaker: '说话者名',
     avatar: '头像类型',
     text: '文本（\n换行）',
     messages: [{from:'other'|'self',text:'...'}], // chat场景用
     choices: [{
       text: '选项文字',
       next: '下一节点ID',
       effects: { assets:±N, alertness:±N, trust:±N },
       requires: { alertness: N },  // 解锁条件
       tip: '选择后提示',
       tipType: 'success'|'danger'|'gold',
       tipClass: 'correct'|'counter'|'danger',  // 按钮样式
       unlockKnowledge: '知识ID',
       unlockAchievement: '成就ID',
       rebirth: true,           // 触发重生
       ending: 'perfect'|'good'|'normal'|'bad',  // 触发结局
       counter: true,            // 触发反击特效
       chapter: N,               // 进入第N章
     }]
   }
   ============================================================ */

// ==================== 音频引擎 ====================
var AudioCtx = null;
var audioEnabled = true;
var bgmGain = null;
var bgmInterval = null;

function initAudio(){
  if(AudioCtx) return;
  try{ AudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
}

function playSFX(type){
  if(!audioEnabled || !AudioCtx) return;
  var now = AudioCtx.currentTime;
  var osc, gain;

  switch(type){
    case 'click':
      osc = AudioCtx.createOscillator(); gain = AudioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain); gain.connect(AudioCtx.destination);
      osc.start(now); osc.stop(now + 0.1);
      break;
    case 'transition':
      osc = AudioCtx.createOscillator(); gain = AudioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain); gain.connect(AudioCtx.destination);
      osc.start(now); osc.stop(now + 0.2);
      break;
    case 'alert':
      for(var i = 0; i < 2; i++){
        var o = AudioCtx.createOscillator(); var g = AudioCtx.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(i === 0 ? 880 : 660, now + i * 0.15);
        g.gain.setValueAtTime(0, now + i * 0.15);
        g.gain.linearRampToValueAtTime(0.08, now + i * 0.15 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.12);
        o.connect(g); g.connect(AudioCtx.destination);
        o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.12);
      }
      break;
    case 'success':
      [523, 659, 784].forEach(function(freq, i){
        var o = AudioCtx.createOscillator(); var g = AudioCtx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(freq, now + i * 0.08);
        g.gain.setValueAtTime(0, now + i * 0.08);
        g.gain.linearRampToValueAtTime(0.1, now + i * 0.08 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.2);
        o.connect(g); g.connect(AudioCtx.destination);
        o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.2);
      });
      break;
    case 'danger':
      osc = AudioCtx.createOscillator(); gain = AudioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain); gain.connect(AudioCtx.destination);
      osc.start(now); osc.stop(now + 0.35);
      break;
    case 'achievement':
      [659, 784, 988, 1175].forEach(function(freq, i){
        var o = AudioCtx.createOscillator(); var g = AudioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(freq, now + i * 0.06);
        g.gain.setValueAtTime(0, now + i * 0.06);
        g.gain.linearRampToValueAtTime(0.08, now + i * 0.06 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.3);
        o.connect(g); g.connect(AudioCtx.destination);
        o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.3);

    case 'rebirth':

        var o = AudioCtx.createOscillator(); var g = AudioCtx.createGain();

        o.type = 'sine'; o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0, now + i * 0.1);
        g.gain.linearRampToValueAtTime(0.06, now + i * 0.1 + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
        o.connect(g); g.connect(AudioCtx.destination);
        o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.4);
      }
      break;
    case 'counter':
      osc = AudioCtx.createOscillator(); gain = AudioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(1200, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain); gain.connect(AudioCtx.destination);
      osc.start(now); osc.stop(now + 0.08);
      var o2 = AudioCtx.createOscillator(); var g2 = AudioCtx.createGain();
      o2.type = 'sine'; o2.frequency.setValueAtTime(440, now + 0.05);
      g2.gain.setValueAtTime(0.08, now + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      o2.connect(g2); g2.connect(AudioCtx.destination);
      o2.start(now + 0.05); o2.stop(now + 0.2);
      break;
    case 'message':
      osc = AudioCtx.createOscillator(); gain = AudioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(960, now);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain); gain.connect(AudioCtx.destination);
      osc.start(now); osc.stop(now + 0.1);
      break;
    case 'ring':
      // 来电铃声（模拟座机振铃）
      for(var ri = 0; ri < 4; ri++){
        var ro = AudioCtx.createOscillator(); var rg = AudioCtx.createGain();
        ro.type = 'sine'; ro.frequency.setValueAtTime(ri % 2 === 0 ? 620 : 480, now + ri * 0.35);
        rg.gain.setValueAtTime(0, now + ri * 0.35);
        rg.gain.linearRampToValueAtTime(0.12, now + ri * 0.35 + 0.03);
        rg.gain.exponentialRampToValueAtTime(0.001, now + ri * 0.35 + 0.28);
        ro.connect(rg); rg.connect(AudioCtx.destination);
        ro.start(now + ri * 0.35); ro.stop(now + ri * 0.35 + 0.28);
      }
      break;
    case 'cash':
      // 转账清点声
      [988, 1319, 1568].forEach(function(freq, ci){
        var co = AudioCtx.createOscillator(); var cg = AudioCtx.createGain();
        co.type = 'triangle'; co.frequency.setValueAtTime(freq, now + ci * 0.05);
        cg.gain.setValueAtTime(0, now + ci * 0.05);
        cg.gain.linearRampToValueAtTime(0.1, now + ci * 0.05 + 0.01);
        cg.gain.exponentialRampToValueAtTime(0.001, now + ci * 0.05 + 0.18);
        co.connect(cg); cg.connect(AudioCtx.destination);
        co.start(now + ci * 0.05); co.stop(now + ci * 0.05 + 0.18);
      });
      break;
  }
}

// ==================== 背景音乐 ====================
// 程序生成环境循环，按章节氛围切换音阶与节奏
var bgmScales = {
  calm:  [220, 247, 277, 294, 330, 370, 415, 440], // 平和（序章/前期）
  tense: [208, 233, 262, 277, 311, 349, 392, 440], // 紧张（中期）
  dark:  [185, 208, 233, 247, 277, 311, 349, 392], // 压迫（终章）
};
var bgmScale = bgmScales.calm;
var bgmMood = 'calm';
var bgmNoteIdx = 0;
var bgmBeatCount = 0;
var bgmPadChords = [1, 1.25, 1.498]; // 大三和弦

function setBGMChapter(ch){
  var mood = 'calm';
  if(ch >= 7) mood = 'dark';
  else if(ch >= 4) mood = 'tense';
  bgmMood = mood;
  bgmScale = bgmScales[mood];
}

function startBGM(){
  if(!audioEnabled || !AudioCtx || bgmInterval) return;
  bgmGain = AudioCtx.createGain();
  bgmGain.gain.value = 0.03;
  bgmGain.connect(AudioCtx.destination);

  bgmInterval = setInterval(function(){
    if(!audioEnabled || !AudioCtx){ stopBGM(); return; }
    var now = AudioCtx.currentTime;

    // 低音
    if(bgmBeatCount % 4 === 0){
      var bassOsc = AudioCtx.createOscillator();
      var bassGain = AudioCtx.createGain();
      bassOsc.type = 'sine';
      bassOsc.frequency.value = bgmScale[0] / 2;
      bassGain.gain.setValueAtTime(0, now);
      bassGain.gain.linearRampToValueAtTime(0.5, now + 0.05);
      bassGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
      bassOsc.connect(bassGain); bassGain.connect(bgmGain);
      bassOsc.start(now); bassOsc.stop(now + 1.5);
    }

    // 和声垫（每4拍一组）
    if(bgmBeatCount % 4 === 2){
      var rootFreq = bgmScale[Math.floor(bgmNoteIdx / 4) % 2 === 0 ? 0 : 2] / 2;
      bgmPadChords.forEach(function(mult){
        var pOsc = AudioCtx.createOscillator();
        var pGain = AudioCtx.createGain();
        pOsc.type = 'sine';
        pOsc.frequency.value = rootFreq * mult;
        pGain.gain.setValueAtTime(0, now);
        pGain.gain.linearRampToValueAtTime(0.15, now + 0.15);
        pGain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
        pOsc.connect(pGain); pGain.connect(bgmGain);
        pOsc.start(now); pOsc.stop(now + 2.8);
      });
    }

    // 鼓点（紧张的节奏）
    if(bgmMood !== 'calm' && bgmBeatCount % 4 === 3){
      var hOsc = AudioCtx.createOscillator();
      var hGain = AudioCtx.createGain();
      hOsc.type = 'sine';
      hOsc.frequency.value = 2200;
      hGain.gain.setValueAtTime(0.06, now);
      hGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      hOsc.connect(hGain); hGain.connect(bgmGain);
      hOsc.start(now); hOsc.stop(now + 0.06);
    }

    var noteFreq = bgmScale[bgmNoteIdx % bgmScale.length];
    var melOsc = AudioCtx.createOscillator();
    var melGain = AudioCtx.createGain();
    melOsc.type = 'triangle';
    melOsc.frequency.value = noteFreq;
    melGain.gain.setValueAtTime(0, now);
    melGain.gain.linearRampToValueAtTime(0.3, now + 0.1);
    melGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    melOsc.connect(melGain); melGain.connect(bgmGain);
    melOsc.start(now); melOsc.stop(now + 1.2);

    bgmNoteIdx++;
    bgmBeatCount++;
  }, 700);
}

function stopBGM(){
  if(bgmInterval){ clearInterval(bgmInterval); bgmInterval = null; }
  if(bgmGain){ try{ bgmGain.gain.exponentialRampToValueAtTime(0.001, AudioCtx.currentTime + 0.5); }catch(e){} }
  bgmGain = null;
}

// =============================================================
// 离线本地WAV语音引擎（完全无需网络，音质稳定自然）
// - WAV放在 voice/ 目录下，命名：
//     CG序幕: cg_01.wav ~ cg_07.wav          (康康男声旁白)
//     序章:   prologue_01.wav ~ prologue_05.wav
//     剧情节点: <nodeId>.wav  如 ch1_start.wav  ch2_01.wav
//     聊天消息分段: <nodeId>_other_0.wav  <nodeId>_self_0.wav ...
// - 机制：若WAV存在 → 用 AudioContext decodeAudioData 播放
//         若不存在 → 回退 Web Speech API
// =============================================================
var WavEngine = {
  cache: {},        // url -> AudioBuffer 缓存
  pending: null,    // 当前正在播放的 {source, gain}
  wavQueue: [],     // WAV播放队列
  busy: false,      // 是否在播放中
  gen: 0,           // 代次令牌：stop() 时自增，在途加载完成后比对，过期则丢弃（防切页漏播）
  root: 'voice/',   // 资源根目录
  // 文本 -> 文件名的模糊匹配缓存（防止每次请求都重复HEAD）
  textCache: {},

  // 判断本地WAV是否存在（轻量同步缓存 + 异步fetch验证）
  _known: {},
  fileExists: function(rel, cb){
    if(this._known[rel] === true){ cb(true); return; }
    if(this._known[rel] === false){ cb(false); return; }
    var url = this.root + rel + '?v=' + (window.__voiceVersion || 1);
    fetch(url, {method:'HEAD'}).then(function(r){
      var ok = r.ok;
      WavEngine._known[rel] = ok;
      cb(ok);
    }).catch(function(){ WavEngine._known[rel] = false; cb(false); });
  },

  // 加载 AudioBuffer（带缓存）
  // 优先使用体积更小的 .mp3（约为 .wav 的 1/6），解码失败再回退 .wav
  loadBuffer: function(rel, cb){
    var ver = '?v=' + (window.__voiceVersion || 1);
    var base = this.root + rel;
    var mp3 = base.replace(/\.wav$/i, '.mp3') + ver;
    var wav = base + ver;
    var self = this;
    function tryUrl(url, onFail){
      if(self.cache[url]){ cb(null, self.cache[url]); return; }
      fetch(url)
        .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
        .then(function(ab){
          if(!AudioCtx){ cb(new Error('no AudioCtx')); return; }
          AudioCtx.decodeAudioData(ab.slice(0), function(buf){
            self.cache[url] = buf;
            cb(null, buf);
          }, function(){ onFail(); });
        })
        .catch(function(){ onFail(); });
    }
    tryUrl(mp3, function(){ tryUrl(wav, function(){ cb(new Error('load fail ' + rel)); }); });
  },

  // 播放一个wav，完成后调用done()
  playWav: function(rel, done){
    if(!AudioCtx){ done && done(); return; }
    initAudio();
    if(AudioCtx.state === 'suspended'){ AudioCtx.resume(); }
    var myGen = WavEngine.gen;   // 记录开始加载时的代次
    this.loadBuffer(rel, function(err, buf){
      if(myGen !== WavEngine.gen){ done && done('__ABORT__'); return; } // 切页，静默放弃
      if(err){ done && done(err); return; } // 真实加载失败
      var src = AudioCtx.createBufferSource();
      var gain = AudioCtx.createGain();
      gain.gain.value = 0.95;
      src.buffer = buf;
      src.connect(gain); gain.connect(AudioCtx.destination);
      src.onended = function(){
        if(WavEngine.pending && WavEngine.pending.source === src){ WavEngine.pending = null; }
        done && done();
      };
      src.start(0);
      WavEngine.pending = { source: src, gain: gain };
    });
  },

  stop: function(){
    this.gen++;   // 令代次失效，使任何在途加载的旧语音作废
    if(this.pending){
      try{ this.pending.source.onended = null; this.pending.source.stop(0); }catch(e){}
      this.pending = null;
    }
    this.wavQueue = [];
    this.busy = false;
  },

  // 入队播放（按顺序）。onItemFail(rel, err) 在单个文件真实加载失败时回调（切页 __ABORT__ 不触发）
  enqueue: function(items, allDone, onItemFail){
    // items: [{rel:'xxx.wav'}]  每一项是wav相对路径
    var self = this;
    self.wavQueue = self.wavQueue.concat(items);
    self._itemFail = onItemFail || self._itemFail;
    if(self.busy){ if(allDone) self._finalAllDone = allDone; return; }
    self.busy = true;
    function next(){
      if(!self.wavQueue.length){
        self.busy = false;
        var f = self._finalAllDone; self._finalAllDone = null;
        self._itemFail = null;
        f && f(); allDone && allDone();
        return;
      }
      var it = self.wavQueue.shift();
      self.playWav(it.rel, function(err){
        if(err && err !== '__ABORT__' && self._itemFail) self._itemFail(it.rel, err);
        next();
      });
    }
    next();
  }
};

// 主入口：给定 nodeId + 文本 + 头像 → 优先播放本地语音，失败则走Web TTS
// 可选 hint 是一个优先匹配的 wav 文件名（不含路径），用于 CG 序幕等特殊场景
function speakWithWav(nodeId, text, avatar, hint){
  if(!voiceEnabled) return;
  if(!audioEnabled) return;
  // 直接以 .wav 路径入队；loadBuffer 内部会优先尝试同名 .mp3，缺失再回退 .wav，
  // 省去逐个候选的 HEAD 探测，把“首音延迟”从 2~4 个网络往返降到约 1 个。
  var wavPath = hint
    ? (String(hint).indexOf('.wav') >= 0 ? hint : hint + '.wav')
    : (nodeId ? nodeId + '.wav' : null);
  if(!wavPath){ fallbackSpeak(text, avatar); return; }
  WavEngine.enqueue([{rel: wavPath}], null, function(rel, err){
    // 仅在“音频文件确实缺失”时回退 Web Speech；切页导致的 __ABORT__ 不回退
    if(err && err !== '__ABORT__') fallbackSpeak(text, avatar);
  });
}

function pickChineseVoice(preferMale){
  if(!speechSynth) return null;
  var voices = speechSynth.getVoices();
  if(!voices || !voices.length) return null;
  // 优先中文语音
  var zh = [];
  for(var i = 0; i < voices.length; i++){
    var l = (voices[i].lang || '').toLowerCase();
    if(l.indexOf('zh') === 0) zh.push(voices[i]);
  }
  var pool = zh.length ? zh : voices;
  // 男声优先列表（康康/云希/云扬等）
  var maleFav = ['kangkang','yunxi','yunyang','yunfeng','yunjian','male'];
  // 女声优先列表
  var femaleFav = ['xiaoxiao','xiaoyi','huihui','tingting','yaoyao','google 普通话','普通话'];
  var fav = preferMale ? maleFav.concat(femaleFav) : femaleFav.concat(maleFav);
  for(var f = 0; f < fav.length; f++){
    for(var v = 0; v < pool.length; v++){
      if(pool[v].name.toLowerCase().indexOf(fav[f]) >= 0) return pool[v];
    }
  }
  return pool[0];
}

function fallbackSpeak(text, avatar){
  if(!voiceEnabled) return;
  if(!speechSynth) return;
  var clean = String(text)
    .replace(/<[^>]*>/g, '')
    .replace(/【[^】]*】/g, '')
    .replace(/[*_~`#]/g, '')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
    .replace(/[★☆◆●■▶▷〔〕"']/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  if(!clean) return;
  // 过长文本按句子边界截断，避免旁白念太久
  if(clean.length > 120){
    var cut = clean.substring(0, 120);
    var idx = Math.max(cut.lastIndexOf('。'), cut.lastIndexOf('！'), cut.lastIndexOf('？'));
    clean = (idx > 60 ? cut.substring(0, idx + 1) : cut) + '。';
  }
  var prof = voiceProfileFor(avatar || 'system');
  // mc(victim)和system(旁白)用男声，骗子(scammer)和friend用女声
  var preferMale = (avatar === 'mc' || avatar === 'system' || !avatar || avatar === '');
  var u = new SpeechSynthesisUtterance(clean);
  var v = pickChineseVoice(preferMale);
  if(v){
    u.voice = v;
    u.lang = v.lang || 'zh-CN';
  }else{
    u.lang = 'zh-CN';
  }
  u.rate = prof.rate;
  u.pitch = prof.pitch;
  u.volume = 1;
  // 入队按顺序播放
  speechQueue.push(u);
  flushSpeechQueue();
}

function flushSpeechQueue(){
  if(speechTimer) return;
  var playNext = function(){
    if(speechTimer){ clearTimeout(speechTimer); speechTimer = null; }
    if(!voiceEnabled){ speechQueue = []; return; }
    var u = speechQueue.shift();
    if(!u) return;
    u.onend = function(){ playNext(); };
    u.onerror = function(){ playNext(); };
    try{
      speechSynth.speak(u);
      speechTimer = setTimeout(function(){ playNext(); }, u.text.length * 180);
    }catch(e){ playNext(); }
  };
  if(speechSynth.speaking || speechSynth.pending){
    setTimeout(playNext, 400);
  }else{
    playNext();
  }
}

function stopSpeech(){
  speechQueue = [];
  if(speechTimer){ clearTimeout(speechTimer); speechTimer = null; }
  if(speechSynth){ try{ speechSynth.cancel(); }catch(e){} }
  // 同时停止本地WAV播放

}

// 首次用户交互时启动音频（浏览器/微信策略要求）
// 微信内置浏览器需通过用户手势或 WeixinJSBridgeReady 事件解锁 AudioContext，
// 否则进页面后始终处于 suspended 状态，导致 BGM/语音无声。
var _audioUnlocked = false;
function unlockAudio(){
  if(_audioUnlocked) return;
  initAudio();
  if(AudioCtx && AudioCtx.state === 'suspended'){
    // resume 可能返回 Promise；只有真正变为 running 才算解锁成功，
    // 否则下次手势继续重试，避免「提前置真导致永久无声」。
    var p = AudioCtx.resume();
    if(p && p.then){
      p.then(function(){ if(AudioCtx.state === 'running') _finishUnlock(); })
       .catch(function(){});
      return;
    }
    return; // 无 Promise：等下次手势再判断
  }
  if(AudioCtx && AudioCtx.state === 'running') _finishUnlock();
}
function _finishUnlock(){
  if(audioEnabled && !bgmInterval) startBGM();
  _audioUnlocked = true;
}
// 持续监听手势直到成功解锁，避免一次性监听在未生效时失效
document.addEventListener('touchstart', unlockAudio, {passive: true});

function saveGame(){
  var data = {
    version: CONFIG.version,
    node: game.node,
    chapter: game.chapter,
    stats: game.stats,
    rebirthCount: game.rebirthCount,
    chapterRebirths: game.chapterRebirths,
    unlockedKnowledge: game.unlockedKnowledge,
    unlockedAchievements: game.unlockedAchievements,
    completedChapters: game.completedChapters,
    counterCount: game.counterCount,
    checkpointStats: game.checkpointStats,
    gameCompleted: game.gameCompleted,
  };
  try{ localStorage.setItem(CONFIG.saveKey, JSON.stringify(data)); }catch(e){}
}
function saveMeta(){
  try{ localStorage.setItem(CONFIG.metaKey, JSON.stringify(meta)); }catch(e){}
}
function loadGame(){
  try{
    var s = localStorage.getItem(CONFIG.saveKey);
    if(!s) return false;
    var d = JSON.parse(s);
    if(d.version !== CONFIG.version){ localStorage.removeItem(CONFIG.saveKey); return false; }
    game.node = d.node; game.chapter = d.chapter; game.stats = d.stats;
    game.rebirthCount = d.rebirthCount||0; game.chapterRebirths = d.chapterRebirths||{};
    game.unlockedKnowledge = d.unlockedKnowledge||[]; game.unlockedAchievements = d.unlockedAchievements||[];
    game.completedChapters = d.completedChapters||[]; game.counterCount = d.counterCount||0;
    game.checkpointStats = d.checkpointStats; game.gameCompleted = d.gameCompleted||false;
    return true;
  }catch(e){ return false; }
}
function loadMeta(){
  try{
    var s = localStorage.getItem(CONFIG.metaKey);
    if(!s) return;
    var d = JSON.parse(s);
    meta.totalRebirths = d.totalRebirths||0;
    meta.unlockedKnowledge = d.unlockedKnowledge||[];
    meta.unlockedAchievements = d.unlockedAchievements||[];
    meta.gameCompleted = d.gameCompleted||false;
  }catch(e){}
}
function hasSave(){
  try{ return !!localStorage.getItem(CONFIG.saveKey); }catch(e){ return false; }
}
function clearSave(){
  try{ localStorage.removeItem(CONFIG.saveKey); }catch(e){}
}

// ==================== 游戏初始化 ====================
function newGame(){
  game.node = 'prologue_01';
  game.chapter = -1;
  game.stats = Object.assign({}, CONFIG.initialStats);
  game.rebirthCount = 0;
  game.chapterRebirths = {};
  game.unlockedKnowledge = [];
  game.unlockedAchievements = [];
  game.completedChapters = [];
  game.counterCount = 0;
  game.checkpointStats = null;
  game.gameCompleted = false;
}

function startNewGame(){
  initAudio();
  if(AudioCtx && AudioCtx.state === 'suspended') AudioCtx.resume();
  setBGMChapter(0);
  startBGM();
  playCGIntro();
}

function playCGIntro(){
  var container = document.getElementById('cg-intro');
  var slides = [
    {img:'avatars/cg_intro_1.jpg', caption:'前世，我接到一个"刷单返利"的电话……', sfx:'danger',  wav:'cg_01.wav'},
    {img:'avatars/cg_intro_2.jpg', caption:'"轻松赚钱"的诱惑，让我一步步深入',     sfx:'danger',  wav:'cg_02.wav'},
    {img:'avatars/cg_intro_3.jpg', caption:'当我发现真相时，积蓄已经清零',           sfx:'danger',  wav:'cg_03.wav'},
    {img:'avatars/cg_intro_4.jpg', caption:'绝望之中，我跪倒在黑暗里',               sfx:'danger',  wav:'cg_04.wav'},
    {img:'avatars/cg_intro_5.jpg', caption:'然而——一束光，照亮了深渊',               sfx:'rebirth', wav:'cg_05.wav'},
    {img:'avatars/cg_intro_6.jpg', caption:'时间开始倒流，命运给了我重来的机会',     sfx:'rebirth', wav:'cg_06.wav'},
    {img:'avatars/cg_intro_8.jpg', caption:'这一次，我要以牙还牙！',                  sfx:'counter', wav:'cg_07.wav'},
  ];
  container.innerHTML = '<button class="cg-skip" onclick="skipCGIntro()">跳过 ⏭</button>' +
    '<div class="cg-title-reveal" id="cg-title-reveal"><div class="main">重生反诈</div><div class="sub">以牙还牙</div></div>';
  slides.forEach(function(s, i){
    var div = document.createElement('div');
    div.className = 'cg-page';
    div.id = 'cg-page-' + i;
    div.innerHTML = '<img src="' + s.img + '" onerror="this.style.display=\'none\'">' +
      '<div class="cg-vignette"></div>' +
      '<div class="cg-caption">' + s.caption + '</div>' +
      '<div class="cg-spine"></div>' +
      '<div class="cg-shadow"></div>';
    container.appendChild(div);
  });
  container.classList.add('active');
  document.getElementById('audio-controls').classList.add('hidden-by-cg');

  // 确保音频上下文初始化（用户已经点击了"开始新游戏"按钮）
  initAudio();
  if(AudioCtx && AudioCtx.state === 'suspended'){ AudioCtx.resume(); }

  var idx = 0;
  var pageTime = 2400; // 每页停留时间（若无本地男声语音则保持此节奏）
  var cgStopped = false;

  // 按页播放（每页对应一段康康男声本地WAV，播完才翻到下一页；跳过则立即停止）
  function showPage(i){
    if(cgStopped) return;
    var cur = document.getElementById('cg-page-' + i);
    if(cur){ cur.classList.add('current'); }
    playSFX(i === 0 ? 'transition' : slides[i].sfx);

    var wav = slides[i].wav;
    // 优先播放本地语音旁白（.mp3优先→.wav回退）；跳过或不存在则用固定pageTime翻页
    if(voiceEnabled && audioEnabled && wav){
      var usedWav = false;
      var mp3Ver = wav.replace(/\.wav$/, '.mp3');
      function playCgVoice(file){
        if(cgStopped) return;
        usedWav = true;
        var tmo = setTimeout(nextPage, 6200);
        WavEngine.playWav(file, function(){
          if(cgStopped) return;
          clearTimeout(tmo);
          setTimeout(nextPage, 350);
        });
      }
      try{
        WavEngine.fileExists(mp3Ver, function(exists){
          if(cgStopped) return;
          if(exists){ playCgVoice(mp3Ver); return; }
          // mp3不存在，尝试wav
          WavEngine.fileExists(wav, function(ex2){
            if(cgStopped) return;
            if(ex2){ playCgVoice(wav); return; }
            // 都不存在：按固定节奏翻页
            setTimeout(nextPage, pageTime);
          });
        });
      }catch(e){ usedWav = false; }
      if(!usedWav){ /* 异步等待 */ }
    }else{
      setTimeout(nextPage, pageTime);
    }
  }

  function nextPage(){
    if(cgStopped) return;
    var prevEl = document.getElementById('cg-page-' + idx);
    if(prevEl){ prevEl.classList.remove('current'); prevEl.classList.add('flipped'); }
    idx++;
    if(idx >= slides.length){
      // 全部翻完 → 标题揭示
      clearInterval(cgIntroTimer); cgIntroTimer = null;
      var lastPage = document.getElementById('cg-page-' + (slides.length - 1));
      if(lastPage){ lastPage.classList.remove('current'); lastPage.classList.add('flipped'); }
      setTimeout(function(){
        playSFX('achievement');
        var tr = document.getElementById('cg-title-reveal');
        if(tr){ tr.classList.add('active'); }
        setTimeout(function(){
          skipCGIntro();
        }, 2800);
      }, 800);
      return;
    }
    playSFX('transition');
    setTimeout(function(){ showPage(idx); }, 600);
  }

  cgIntroTimer = setInterval(function(){ /* 占位，供 skipCGIntro 清理逻辑判断 */ }, 9999999);
  window.__cgStop = function(){ cgStopped = true; };

  // 显示第一页
  setTimeout(function(){
    showPage(0);
  }, 300);
}

var cgIntroTimer = null;
function skipCGIntro(){
  try{ if(window.__cgStop) window.__cgStop(); }catch(e){}
  try{ if(WavEngine) WavEngine.stop(); }catch(e){}
  if(cgIntroTimer){ clearInterval(cgIntroTimer); cgIntroTimer = null; }
  var container = document.getElementById('cg-intro');
  container.classList.remove('active');
  document.getElementById('audio-controls').classList.remove('hidden-by-cg');
  container.innerHTML = '<button class="cg-skip" onclick="skipCGIntro()">跳过 ⏭</button>';
  newGame();
  showScreen('game');
  renderNode(game.node);
  saveGame();
}

function continueGame(){
  initAudio();
  if(AudioCtx && AudioCtx.state === 'suspended') AudioCtx.resume();
  if(loadGame()){
    setBGMChapter(game.chapter);
    startBGM();
    showScreen('game');
    renderNode(game.node);
  } else {
    showToast('没有存档', 'danger');
  }
}

// ==================== 屏幕切换 ====================
function showScreen(name){
  var screens = document.querySelectorAll('.screen');
  screens.forEach(function(s){ s.classList.remove('active'); });
  var map = { title:'screen-title', game:'screen-game', ending:'screen-ending',
              encyclopedia:'screen-encyclopedia', achievements:'screen-achievements' };
  var el = document.getElementById(map[name] || map.title);
  el.classList.add('active');
  if(name === 'title') updateTitleScreen();
  if(name === 'encyclopedia') renderEncyclopedia();
  if(name === 'achievements') renderAchievements();
  if(name === 'ending'){ stopBGM(); stopSpeech(); }
  if(name === 'title' && audioEnabled) startBGM();
  // 离开游戏场景时停止语音播报
  if(name !== 'game') stopSpeech();
}

function updateTitleScreen(){
  var btn = document.getElementById('btn-continue');
  if(hasSave()) btn.classList.remove('disabled');
  else btn.classList.add('disabled');
}

// ==================== 渲染状态栏 ====================
function renderStatusBar(){
  var s = game.stats;
  var bar = document.getElementById('statusBar');
  var alertPct = Math.max(0, Math.min(100, s.alertness));
  var trustPct = Math.max(0, Math.min(100, s.trust));
  var chapterName = game.chapter >= 0 ? CHAPTERS[game.chapter].title + '·' + CHAPTERS[game.chapter].name : '序章';
  
  bar.innerHTML =
    '<div class="stat-chip assets"><span class="icon">💰</span><span class="val">¥' + formatNum(s.assets) + '</span></div>' +
    '<div class="stat-chip alert' + (s.alertness < 20 ? ' low' : '') + '"><span class="icon">🛡️</span><span class="val">' + Math.round(s.alertness) + '</span>' +
      '<div class="stat-bar"><div class="stat-bar-fill alert" style="width:' + alertPct + '%"></div></div></div>' +
    '<div class="stat-chip trust"><span class="icon">🎭</span><span class="val">' + Math.round(s.trust) + '</span>' +
      '<div class="stat-bar"><div class="stat-bar-fill trust" style="width:' + trustPct + '%"></div></div></div>' +
    '<div class="stat-chip rebirth"><span class="icon">🔄</span><span class="val">' + game.rebirthCount + '</span></div>' +
    '<div class="chapter-badge">' + chapterName + '</div>';
}

function formatNum(n){
  return Math.round(n).toLocaleString('zh-CN');
}

// ==================== 渲染节点 ====================
function renderNode(nodeId){
  // 特殊处理
  if(nodeId === 'rebirth'){ triggerRebirth(); return; }
  if(nodeId === 'ending_check'){ checkEnding(); return; }
  
  var node = STORY[nodeId];
  if(!node){ console.error('节点不存在:', nodeId); return; }
  
  game.node = nodeId;
  saveGame();
  
  // 处理章节切换
  if(node.choices){
    for(var i=0; i<node.choices.length; i++){
      if(node.choices[i].chapter !== undefined && node.choices[i].chapter >= 0){
        // 标记待切换章节（在选定时处理）
      }
    }
  }
  
  renderStatusBar();
  renderScene(node, nodeId);
  renderChoices(node);
  playSFX('transition');
}

// ==================== 场景渲染 ====================
function renderScene(node, nodeId){
  var area = document.getElementById('sceneArea');
  var scene = node.scene || 'narration';

  // 切换场景时停止上一段语音，并使未执行的延迟朗读失效
  stopSpeech();
  speechScheduleId++;

  if(scene === 'narration'){
    area.innerHTML = renderNarration(node);
    // 注意：即使是 system 旁白，若存在对应的 WAV 也要播放（否则只朗读人物台词）
    var sp = node.avatar || '';
    if(sp !== ''){
      scheduleVoice(node.text, node.avatar, 100, nodeId);
    }else{
      scheduleVoice(node.text, 'system', 100, nodeId);
    }
  }
  else if(scene === 'chat'){
    area.innerHTML = renderChat(node);
    playSFX('message');
    scheduleChatVoice(node, nodeId);
  }
  else if(scene === 'call'){
    area.innerHTML = renderCall(node);
    playSFX('ring');
    // 骗子来电台词朗读；"(我...)"/"（我...）"开头的台词是受害人自己说的
    var selfTalk = /^[（(]我/.test(node.text || '');
    scheduleVoice(node.text, selfTalk ? 'mc' : node.avatar, 150, nodeId);
  }
  else if(scene === 'transfer'){
    area.innerHTML = renderTransfer(node);
    playSFX('cash');
  }
  else if(scene === 'popup'){
    area.innerHTML = renderPopup(node);
    playSFX('message');
    // 弹窗多为数据/权限表格，只朗读诈骗分子的"口头话术"
    if(node.voice) scheduleVoice(node.voice, node.avatar, 120, nodeId);
  }

  // 滚到底部
  setTimeout(function(){ area.scrollTop = area.scrollHeight; }, 50);
}

// 朗读延迟调度（避免与界面动画冲突）；场景切换后旧调度自动失效
function scheduleVoice(text, avatar, delay, nodeId){
  var myId = speechScheduleId;
  setTimeout(function(){
    if(myId !== speechScheduleId) return;
    speakWithWav(nodeId || lastNodeId, text, avatar);
  }, delay);
}

// 聊天消息逐条朗读：优先尝试 <nodeId>_<other|self>_<i>.wav
function scheduleChatVoice(node, nodeId){
  var msgs = node.messages || [];
  var myId = speechScheduleId;
  var t = 180;
  msgs.forEach(function(m, i){
    if(m.from === 'system') return; // 系统消息不朗读
    var av = (m.from === 'self') ? 'mc' : (node.avatar || 'stranger');
    (function(msg, prof, d, idx, fromTag){
      setTimeout(function(){
        if(myId !== speechScheduleId) return;
        var hint = nodeId ? (nodeId + '_' + fromTag + '_' + idx + '.wav') : null;
        speakWithWav(nodeId, msg, prof, hint);
      }, d);
    })(m.text, av, t, i, m.from);
    t += Math.min(2000, Math.max(450, String(m.text).length * 100));
  });
}

function renderNarration(node){
  var html = '<div class="scene-narration">';
  if(node.avatar) html += '<div class="narration-avatar">' + avatarSVG(node.avatar) + '</div>';
  html += '<div class="narration-text">' + processText(node.text || '') + '</div>';
  html += '</div>';
  return html;
}

function renderChat(node){
  var html = '<div class="scene-chat">';
  // 聊天头
  if(node.speaker){
    html += '<div class="chat-header">' +
      '<div class="av">' + avatarSVG(node.avatar || 'stranger') + '</div>' +
      '<div class="name">' + node.speaker + '</div>' +
      '<div class="status">在线</div></div>';
  }
  // 消息
  var msgs = node.messages || (node.text ? [{from:'other', text:node.text}] : []);
  msgs.forEach(function(m, i){
    var delay = (i * 0.12).toFixed(2);
    if(m.from === 'system'){
      html += '<div class="chat-bubble system" style="animation-delay:' + delay + 's">' + m.text + '</div>';
    } else {
      html += '<div class="chat-row" style="animation-delay:' + delay + 's">';
      if(m.from === 'other') html += '<div class="av">' + avatarSVG(node.avatar || 'stranger') + '</div>';
      html += '<div class="chat-bubble ' + m.from + '">' + m.text + '</div>';
      if(m.from === 'self') html += '<div class="av">' + avatarSVG('mc') + '</div>';
      html += '</div>';
    }
  });
  html += '</div>';
  return html;
}

function renderCall(node){
  var html = '<div class="scene-call">';
  html += '<div class="call-icon">' + avatarSVG(node.avatar || 'service') + '</div>';
  html += '<div class="call-name">' + (node.caller || node.speaker || '未知号码') + '</div>';
  if(node.number) html += '<div class="call-num">' + node.number + '</div>';
  html += '<div class="call-timer">通话中...</div>';
  html += '<div class="call-subtitle">' + processText(node.text || '') + '</div>';
  html += '</div>';
  return html;
}

function renderTransfer(node){
  var html = '<div class="scene-transfer">';
  html += '<div class="transfer-title">银行转账</div>';
  html += '<div class="transfer-card">';
  var lines = (node.text || '').split('\n');
  lines.forEach(function(line){
    var parts = line.split('：');
    if(parts.length >= 2){
      html += '<div class="transfer-row"><span class="transfer-label">' + parts[0] + '</span><span class="transfer-val">' + parts.slice(1).join('：') + '</span></div>';
    }
  });
  html += '</div>';
  if(node.warning) html += '<div class="transfer-warning">' + node.warning + '</div>';
  html += '</div>';
  return html;
}

function renderPopup(node){
  var html = '<div class="scene-popup">';
  html += '<div class="popup-phone">';
  html += '<div class="popup-bar"><span>9:41</span><span>📶 🔋</span></div>';
  html += '<div class="popup-notification">';
  html += '<div class="popup-icon" style="background:' + (node.avatar === 'guru' ? '#d97706' : '#2563eb') + ';overflow:hidden">' + avatarSVG(node.avatar || 'system') + '</div>';
  html += '<div class="popup-content">';
  html += '<div class="title">' + (node.speaker || '通知') + '</div>';
  html += '<div class="text">' + processText(node.text || '') + '</div>';
  if(node.warning) html += '<div class="text" style="color:#f87171;margin-top:4px">' + node.warning + '</div>';
  html += '</div></div></div></div>';
  return html;
}

function processText(text){
  // 将换行转为<br>，保留HTML标签（内容可控，无注入风险）
  return String(text).replace(/\n/g, '<br>');
}

// ==================== 渲染选项 ====================
function renderChoices(node){
  var area = document.getElementById('choiceArea');
  var choices = node.choices || [];
  
  if(choices.length === 0){
    area.innerHTML = '';
    return;
  }
  
  var html = '';
  choices.forEach(function(ch, i){
    var cls = 'choice-btn';
    if(ch.tipClass) cls += ' ' + ch.tipClass;
    
    // 检查解锁条件
    var locked = false;
    var lockText = '';
    if(ch.requires && ch.requires.alertness){
      if(game.stats.alertness < ch.requires.alertness){
        locked = true;
        lockText = '🔒 需警惕值' + ch.requires.alertness;
      }
    }
    if(locked) cls += ' locked';
    
    html += '<button class="' + cls + '" style="animation-delay:' + (i * 0.06) + 's" ' +
      (locked ? 'disabled' : 'onclick="makeChoice(' + i + ')"') + '>';
    html += '<span>' + ch.text + '</span>';
    if(locked) html += '<span class="lock">' + lockText + '</span>';
    else html += '<span class="arrow">›</span>';
    html += '</button>';
  });
  area.innerHTML = html;
}

// ==================== 选择处理 ====================
function makeChoice(index){
  playSFX('click');
  var node = STORY[game.node];
  if(!node || !node.choices || !node.choices[index]) return;
  var ch = node.choices[index];
  
  // 应用数值变化
  if(ch.effects){
    if(ch.effects.assets !== undefined) game.stats.assets += ch.effects.assets;
    if(ch.effects.alertness !== undefined) game.stats.alertness += ch.effects.alertness;
    if(ch.effects.trust !== undefined) game.stats.trust += ch.effects.trust;
  }
  // 数值钳制
  game.stats.alertness = Math.max(0, Math.min(100, game.stats.alertness));
  game.stats.trust = Math.max(0, Math.min(100, game.stats.trust));
  
  // 反击计数
  if(ch.counter){
    game.counterCount++;
    showCounterFlash();
    playSFX('counter');
    if(game.counterCount >= 1) unlockAchievement('a3');
    if(game.counterCount >= 3) unlockAchievement('a4');
    if(game.counterCount >= 10) unlockAchievement('a5');
  }
  
  // 解锁知识
  if(ch.unlockKnowledge) unlockKnowledge(ch.unlockKnowledge);
  
  // 解锁成就
  if(ch.unlockAchievement) unlockAchievement(ch.unlockAchievement);
  
  // 显示提示
  if(ch.tip) showToast(ch.tip, ch.tipType || '');
  
  // 音效
  if(ch.tipType === 'success') playSFX('success');
  else if(ch.tipType === 'danger') playSFX('danger');
  
  // 章节切换
  if(ch.chapter !== undefined && ch.chapter >= 0){
    game.chapter = ch.chapter;
    game.checkpointStats = Object.assign({}, game.stats);
    saveGame();
    // 切换 BGM 氛围
    setBGMChapter(ch.chapter);
  }
  
  // 触发结局
  if(ch.ending){
    setTimeout(function(){ showEnding(ch.ending); }, 800);
    return;
  }
  
  // 触发重生
  if(ch.rebirth){
    setTimeout(function(){ triggerRebirth(); }, 800);
    return;
  }
  
  // 更新状态栏
  renderStatusBar();
  
  // 跳转下一节点
  setTimeout(function(){ renderNode(ch.next); }, ch.tip ? 1200 : 400);
}

// ==================== 重生机制 ====================
function triggerRebirth(){
  stopSpeech();
  playSFX('rebirth');
  game.rebirthCount++;
  meta.totalRebirths = (meta.totalRebirths || 0) + 1;
  
  // 章节重生计数
  var chId = game.chapter >= 0 ? CHAPTERS[game.chapter].id : 'prologue';
  game.chapterRebirths[chId] = (game.chapterRebirths[chId] || 0) + 1;
  
  // 重生加成
  game.stats.alertness = Math.min(100, game.stats.alertness + CONFIG.rebirthAlertnessBonus);
  
  // 恢复检查点
  if(game.checkpointStats){
    game.stats.assets = game.checkpointStats.assets;
    game.stats.trust = game.checkpointStats.trust;
    // 警惕值保留（包含重生加成）
  } else {
    game.stats = Object.assign({}, CONFIG.initialStats);
  }
  
  // 成就
  unlockAchievement('a1');
  if(meta.totalRebirths >= 5) unlockAchievement('a9');
  
  saveMeta();
  saveGame();
  
  // 播放重生动画
  playRebirthAnimation(function(){
    // 提示
    if(game.chapterRebirths[chId] >= CONFIG.hintAfterRebirths){
      showToast('提示：选择"将计就计"选项需要更高的警惕值。正确识破骗局可提升警惕值。', 'gold');

    var startNode = game.chapter >= 0 ? CHAPTERS[game.chapter].startNode : 'prologue_01';
    renderNode(startNode);
  });
}

// ==================== 背景粒子Canvas ====================
function initBackgroundCanvas(){
  var canvas = document.getElementById('bgCanvas');
  var ctx = canvas.getContext('2d');
  
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  var particles = [];
  var count = window.innerWidth < 480 ? 25 : 45;
  for(var i = 0; i < count; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.5 + 0.5,
      o: Math.random() * 0.25 + 0.05,
      hue: Math.random() > 0.5 ? '100,150,255' : '80,120,220',
    });
  }
  
  function animate(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(function(p){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0) p.x = canvas.width;
      if(p.x > canvas.width) p.x = 0;
      if(p.y < 0) p.y = canvas.height;
      if(p.y > canvas.height) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.hue + ',' + p.o + ')';
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

// ==================== 重生动画Canvas ====================
function playRebirthAnimation(callback){
  var canvas = document.getElementById('rebirthCanvas');
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  
  var cx = canvas.width / 2;
  var cy = canvas.height / 2;
  var particles = [];
  var count = 80;
  
  for(var i = 0; i < count; i++){
    var angle = (i / count) * Math.PI * 2 * 4;
    var radius = 200 + Math.random() * 150;
    particles.push({
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius,
      tx: cx, ty: cy,
      r: Math.random() * 2.5 + 0.5,
      o: 1,
      speed: 0.02 + Math.random() * 0.03,
    });
  }
  
  var frame = 0;
  var totalFrames = 100;
  
  function animate(){
    var progress = frame / totalFrames;
    
    // 渐变背景
    ctx.fillStyle = 'rgba(15, 25, 35, ' + Math.min(progress * 3, 1) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if(frame < 70){
      particles.forEach(function(p){
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;
        p.o = 1 - progress;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(100, 180, 255, ' + p.o + ')';
        ctx.fill();
      });
    }
    
    // 中央光圈
    if(frame >= 40){
      var glowR = (frame - 40) * 8;
      var glowO = Math.max(0, 1 - (frame - 40) / 30);
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      grad.addColorStop(0, 'rgba(100, 200, 255, ' + glowO + ')');
      grad.addColorStop(1, 'rgba(100, 200, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    
    // 重生文字
    if(frame >= 50 && frame < 90){
      var textO = Math.min(1, (frame - 50) / 10) * Math.max(0, 1 - (frame - 75) / 15);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + textO + ')';
      ctx.font = 'bold ' + Math.min(48, canvas.width * 0.12) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('重 生', cx, cy);
      
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(150, 200, 255, ' + textO + ')';
      ctx.fillText('记忆已留存 · 警惕值提升', cx, cy + 40);
    }
    
    // 淡出
    if(frame >= 85){
      ctx.fillStyle = 'rgba(15, 25, 35, ' + ((frame - 85) / 15) + ')';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    
    frame++;
    if(frame < totalFrames){
      requestAnimationFrame(animate);
    } else {
      canvas.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if(callback) callback();
    }
  }
  animate();
}

  }, { passive: false });
  
  // 阻止手势缩放
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
}

// ==================== 分享游戏 ====================
function shareGame(){
  var url = window.location.href;
  var title = '重生反诈：以牙还牙 — 你能识破所有骗局吗？';
  var text = '🎮 重生反诈：以牙还牙\n10种真实电信诈骗场景，重生反击，守护财产！\n96110 全国反诈热线\n';
  // 微信内置浏览器：navigator.share 不可用，execCommand 复制剪贴板也常被拦截。
  // 最稳妥的做法是引导用户使用微信原生的「右上角 ··· 分享」。
  if(/MicroMessenger/i.test(navigator.userAgent)){
    showToast('请点击右上角 ··· 分享给好友或朋友圈', 'info');
    return;
  }
  if(navigator.share){
    navigator.share({ title:title, text:text, url:url }).catch(function(){});
  } else {
    // 复制到剪贴板
    var input = document.createElement('textarea');
    input.value = text + url;
    document.body.appendChild(input);
    input.select();
    try{ document.execCommand('copy'); showToast('链接已复制到剪贴板', 'success'); }catch(e){}
    document.body.removeChild(input);
  }
}

// ==================== 资源预加载 ====================
function preloadAssets(){
  // 预载全部角色头像 + 关键背景图，确保游戏中不出现图片加载延迟（仅语音按需）
  var imgs = [
    'avatars/title_bg.jpg',
    'avatars/mc.png','avatars/victim.png','avatars/stranger.png','avatars/service.png',
    'avatars/service_scam.png','avatars/guru.png','avatars/loaner.png','avatars/buyer.png',
    'avatars/prosecutor.png','avatars/friend.png','avatars/police.png',
    'avatars/porn_scam.png','avatars/romance_scam.png',
    'avatars/cg_intro_1.jpg','avatars/cg_intro_2.jpg','avatars/cg_intro_3.jpg','avatars/cg_intro_4.jpg',
    'avatars/cg_intro_5.jpg','avatars/cg_intro_6.jpg','avatars/cg_intro_8.jpg',
    'avatars/ending_bad.jpg',
  ];
  var loaded = 0;
  var total = imgs.length;
  var fill = document.getElementById('loading-bar-fill');
  var txt = document.getElementById('loading-text');

  function tick(src){
    loaded++;
    var pct = Math.min(100, Math.round(loaded / total * 100));
    if(fill) fill.style.width = pct + '%';
    if(txt) txt.textContent = (loaded < total ? ('加载资源... ' + pct + '%') : '加载完成 点击进入游戏');
    if(loaded >= total){
      setTimeout(function(){
        var ls = document.getElementById('loading-screen');
        if(ls){ ls.classList.add('done'); setTimeout(function(){ if(ls) ls.style.display = 'none'; }, 600); }
      }, 200);
    }
  }

  imgs.forEach(function(src){
    var img = new Image();
    img.onload = img.onerror = function(){ tick(src); };
    img.src = src;
  });
}

// 启动
init();
preloadAssets();
</script>
